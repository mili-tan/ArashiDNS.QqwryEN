name: Build QQWRY-EN

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Download previous caches
        run: |
          curl -sL https://github.com/mili-tan/ArashiDNS.QqwryEN/releases/latest/download/location_cache.tsv -o location_cache.tsv || true
          curl -sL https://github.com/mili-tan/ArashiDNS.QqwryEN/releases/latest/download/isp_cache.tsv -o isp_cache.tsv || true
          curl -sL https://github.com/mili-tan/ArashiDNS.QqwryEN/releases/latest/download/translation_cache.tsv -o translation_cache.tsv || true

      - name: Download ips
        run: |
          curl -sL https://github.com/sjzar/ips/releases/latest/download/ips_linux -o ips
          chmod +x ips
          sudo mv ips /usr/local/bin/

      - name: Download qqwry.ipdb
        run: |
          curl -sL https://github.com/nmgliangwei/qqwry.ipdb/releases/latest/download/qqwry.ipdb -o qqwry.ipdb

      - name: Export qqwry.ipdb to txt
        run: |
          ips dump -i qqwry.ipdb -o qqwry.txt

      - name: Build project
        run: dotnet build -c Release

      - name: Run translation
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: dotnet run -c Release

      - name: Pack to ipdb
        run: |
          ips pack -i output_en.txt -o qqwry_en.ipdb

      - name: Generate release tag
        id: tag
        run: |
          echo "tag=v$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: QQWRY-EN ${{ steps.tag.outputs.date }}
          body: |
            QQWRY IP Database English Translation
            Updated on ${{ steps.tag.outputs.date }}

            ## Files
            - `qqwry_en.ipdb` - IPDB format
            - `output_en.txt` - TXT format
            - `location_cache.tsv` - Location cache
            - `isp_cache.tsv` - ISP cache
            - `translation_cache.tsv` - General cache
          files: |
            qqwry_en.ipdb
            output_en.txt
            location_cache.tsv
            isp_cache.tsv
            translation_cache.tsv
          draft: false
          prerelease: false

      - name: Cleanup old releases
        uses: actions/github-script@v7
        with:
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            if (releases.length > 3) {
              const toDelete = releases.slice(3);
              for (const release of toDelete) {
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.id
                });
                try {
                  await github.rest.git.deleteRef({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ref: `tags/${release.tag_name}`
                  });
                } catch (e) {
                  console.log(`Failed to delete tag ${release.tag_name}: ${e.message}`);
                }
              }
              console.log(`Deleted ${toDelete.length} old releases`);
            } else {
              console.log('No old releases to delete');
            }
